[project]
name = "part1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "bcrypt==4.0.0",
    "fastapi[standard]>=0.162.3",
    "greenlet>=3.5.6",
    "passlib[bcrypt]>=1.7.4",
    "sqlmodel>=0.0.49",
]

[project.scripts]
run_server = "app.scripts:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
